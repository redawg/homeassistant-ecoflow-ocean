          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - label: cdo
              domain: camera
            - entity_id: "*.cdo_*"
              domain: camera
        sort:
          method: name
        options:
          type: picture-entity
          camera_view: live
          show_state: false
          show_name: true

      - type: custom:auto-entities
