# CDO dashboard — auto-populated by label or entity id prefix
#
# An entity is included when ANY of these match:
#   1. Label "CDO" (slug: cdo)
#   2. Entity id object_id starts with "cdo_" (e.g. sensor.cdo_ecobee_humidity)
#
# Install HACS card: Auto Entities (custom-cards/auto-entities)

title: CDO
theme: ecoflow_ocean
background: var(--primary-background-color)

views:
  - title: Overview
    path: overview
    icon: mdi:home-map-marker
    theme: ecoflow_ocean
    cards:
      - type: markdown
        content: |
          ## CDO
          Cards auto-populate from entities with label **CDO** or entity ids starting with **`cdo_`**
          (e.g. `climate.cdo_ecobee`, `camera.cdo_front_door`).

      - type: custom:auto-entities
        card:
          type: entities
          title: CDO — all entities
          show_header_toggle: false
        filter:
          include:
            - label: cdo
            - entity_id: "*.cdo_*"
        sort:
          method: domain
          reverse: false
          numeric: false
          ignore_case: true

      - type: custom:auto-entities
        card:
          type: entities
          title: Climate & water
          show_header_toggle: false
        filter:
          include:
            - label: cdo
              domain: climate
            - entity_id: "*.cdo_*"
              domain: climate
            - label: cdo
              domain: water_heater
            - entity_id: "*.cdo_*"
              domain: water_heater
            - label: cdo
              domain: humidifier
            - entity_id: "*.cdo_*"
              domain: humidifier
            - label: cdo
              domain: fan
            - entity_id: "*.cdo_*"
              domain: fan
        sort:
          method: name

      - type: custom:auto-entities
        card:
          type: entities
          title: Security & access
          show_header_toggle: false
        filter:
          include:
            - label: cdo
              domain: lock
            - entity_id: "*.cdo_*"
              domain: lock
            - label: cdo
              domain: alarm_control_panel
            - entity_id: "*.cdo_*"
              domain: alarm_control_panel
            - label: cdo
              domain: binary_sensor
            - entity_id: "*.cdo_*"
              domain: binary_sensor
        sort:
          method: name

      - type: custom:auto-entities
        card:
          type: entities
          title: Lights & switches
          show_header_toggle: false
        filter:
          include:
            - label: cdo
              domain: light
            - entity_id: "*.cdo_*"
              domain: light
            - label: cdo
              domain: switch
            - entity_id: "*.cdo_*"
              domain: switch
            - label: cdo
              domain: input_boolean
            - entity_id: "*.cdo_*"
              domain: input_boolean
        sort:
          method: name

  - title: Climate
    path: climate
    icon: mdi:thermostat
    theme: ecoflow_ocean
    cards:
      - type: custom:auto-entities
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          include:
            - label: cdo
              domain: climate
            - entity_id: "*.cdo_*"
              domain: climate
        sort:
          method: name
        options:
          type: thermostat

      - type: custom:auto-entities
        card:
          type: entities
          title: EcoNet & HVAC
          show_header_toggle: false
        filter:
          include:
            - label: cdo
              integration: rheem_econet
            - entity_id: "*.cdo_*"
              integration: rheem_econet
            - label: cdo
              domain: water_heater
            - entity_id: "*.cdo_*"
              domain: water_heater
            - label: cdo
              domain: climate
            - entity_id: "*.cdo_*"
              domain: climate
        sort:
          method: name

      - type: custom:auto-entities
        card:
          type: entities
          title: Ecobee
          show_header_toggle: false
        filter:
          include:
            - label: cdo
              integration: ecobee
            - entity_id: "*.cdo_*"
