# Dark theme inspired by the EcoFlow mobile app.
# Enable in Profile → Theme, or set as dashboard theme below.
ecoflow_ocean:
  modes:
    dark:
      primary-color: "#00E676"
      accent-color: "#FFB300"
      primary-background-color: "#0D0D0D"
      secondary-background-color: "#1A1A1A"
      card-background-color: "#1E1E1E"
